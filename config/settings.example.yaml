# Copier en config/settings.yaml (ignoré par git).

pipeline:
  posts_per_day_per_account: 3   # cible une fois la montée en charge faite (le code plafonne à 5)
  review_mode: manual            # manual = un humain valide chaque vidéo (swipe) ; auto = contrôle qualité seulement
  idea_review: auto              # auto = les idées partent en production sans relecture ; manual = relecture
  auto_approve_strategy: false   # la stratégie d'une app est validée par un humain avant toute production
  stock_target: 6                # vidéos prêtes d'avance par téléphone ; en dessous, l'autopilote en prépare
  ideas_per_batch: 6
post_mode: assist       # assist = tout est préparé sur le téléphone, un humain appuie sur « Publier » ; auto = publication complète
autopilot_interval_minutes: 5
metrics_every_hours: 6

llm:
  model: claude-opus-5-5         # par défaut pour toutes les tâches ; surcharge possible par tâche
  tasks:                         # effort : low | medium | high | xhigh | max
    asset.describe: {effort: low}
    app.analyze: {effort: high}
    strategy.generate: {effort: high}
    ideas.generate: {effort: high}
  timeout_s: 600
  keychain_service: loopcast-anthropic   # clé dans le trousseau macOS, ou variable ANTHROPIC_API_KEY (jamais ici)
  demo: false                    # true = réponses de démo, sans clé ni coût

budget:                          # plafonds en $ ; au-delà, les générations attendent le lendemain
  daily_usd: 25
  daily_usd_per_app: 15
  monthly_usd: 600

jobs:
  threads: 3                     # exécutants de la file de tâches
  limits:                        # tâches simultanées par famille
    "video.": 2
    "content.render": 1

render:
  remotion_browser: null   # null = Remotion télécharge son Chrome ; sinon chemin d'un chrome-headless-shell

ai_disclosure:
  # Activer le label « contenu généré par IA » de la plateforme dès qu'un format utilise
  # des visages, voix ou scènes réalistes générés (UGC IA, Veo…). Les formats texte/UI actuels n'en ont pas besoin.
  label_by_default: false

apps:                            # comprendre une app (engine/loopcast/apps)
  max_upload_mb: 500             # captures, vidéos de démo enregistrées sur iPhone, documents
  fetch_timeout_s: 20            # lecture de l'App Store, du site, de Google Play
  max_page_bytes: 4000000
  max_source_chars: 20000        # texte gardé par source
  analysis_images: 8             # captures montrées à Claude pendant l'analyse
  appstore_screenshots: 10       # captures de l'App Store importées si l'équipe n'en fournit pas
  max_question_rounds: 3

diffusion:                       # planification et publication (engine/loopcast/diffusion)
  dry_run: false                 # true = tout est planifié et journalisé, rien n'est publié
  jitter_minutes: 20             # petit décalage des créneaux, stable pour un compte et un jour
  instagram_offset_minutes: [30, 90]   # le même contenu part sur l'Instagram du téléphone, plus tard
  retry_minutes: [10, 30]        # nouvelles tentatives d'un post en échec
  late_tolerance_minutes: 60     # un créneau manqué de plus d'1 h est annulé (pas de rafale au redémarrage)
  running_timeout_minutes: 45    # un post resté « en cours » passe « à finir » au lieu d'être republié
  stock_check_hours: 6
  metrics_days: 30
  winners: {window_days: 14, top_share: 0.2, min_posts: 5}
  ios_app:                       # publication en pilotant l'app sur l'iPhone : NON VÉRIFIÉE, désactivée
    enabled: false
    shortcut_name: Loopcast Import
    album: Loopcast

regulator:
  ramp:            # montée en charge selon l'âge du compte (jours depuis `created`)
    - {from_day: 0,  per_day: 1}
    - {from_day: 7,  per_day: 2}
    - {from_day: 14, per_day: max}   # max = defaults.max_per_day du téléphone
  metrics_min_age_hours: 24          # on ne juge un post qu'après 24 h
  slow_down_ratio: 0.4               # médiane(5 derniers) / médiane(10 précédents) < 0.4 → -1 post/jour
  speed_up_ratio: 1.5                # > 1.5 → +1 post/jour (jusqu'au max)
  dead_views: 30                     # 3 posts d'affilée sous ce seuil → pause 48 h + alerte humaine
  pause_hours: 48

farm:
  # Ferme d'iPhones branchés au Mac (voir docs/ferme-iphone.md)
  backend: pymobiledevice3          # pymobiledevice3 (vrais iPhones, sur le Mac) | fake (démo, tests)
  appium_url: http://127.0.0.1:4723
  poll_seconds: 15                  # un tour de supervision (branchement, confiance, mode dév., batterie)
  thumb_seconds: 5                  # vignettes d'écran du dashboard
  battery_low: 25
  offline_alert_minutes: 10         # alerte si un iPhone reste débranché plus longtemps
  wda_base_port: 8100               # ports WebDriverAgent : 8100 + rang de l'iPhone dans devices.yaml
  mjpeg_base_port: 9100             # flux vidéo : 9100 + rang
  xcode_org_id: null                # Team ID Apple Developer (signature de WebDriverAgent)
  wda_bundle_id: null               # ex. com.<entreprise>.loopcast.wda (identifiant propre à l'équipe)

notify:
  ntfy_url: null                    # ex. https://ntfy.sh/loopcast-<suffixe-secret> : push sur les iPhones de l'équipe
