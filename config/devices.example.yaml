# Copier en config/devices.yaml (ignoré par git) et remplir les numéros de série (`adb devices`).
#
# Règle : 1 téléphone = 1 compte par plateforme = 1 marque + 1 langue.
# Pas de proxy, pas de faux réglages de localisation : chaque compte vit là où vit son téléphone.

defaults:
  timezone: Europe/Paris
  windows: ["07:30-09:00", "12:00-14:00", "18:00-22:30"]   # créneaux de publication (heure locale)
  min_gap_minutes: 180                                       # écart minimum entre 2 posts d'un même compte
  max_per_day: 3                                             # plafond du régulateur (le code plafonne à 5 quoi qu'il arrive)

devices:
  - id: phone-1
    serial: "CHANGE_ME"
    lang: fr
    brands: [habitudo]
    accounts:
      tiktok:    {handle: "@habitudo.fr", created: 2026-11-01}
      instagram: {handle: "@habitudo.fr", created: 2026-11-01}

  - id: phone-2
    serial: "CHANGE_ME"
    lang: en
    brands: [habitudo]
    accounts:
      tiktok:    {handle: "@habitudo.app", created: 2026-11-01}
      instagram: {handle: "@habitudo.app", created: 2026-11-01}

  - id: phone-3
    serial: "CHANGE_ME"
    lang: fr
    brands: []          # à affecter à la 2e app
    accounts: {}

  - id: phone-4
    serial: "CHANGE_ME"
    lang: en
    brands: []
    accounts: {}

  - id: phone-5
    serial: "CHANGE_ME"
    lang: fr
    brands: []
    accounts: {}
