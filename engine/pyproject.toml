[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcast"
version = "0.1.0"
description = "Création, publication et mesure de contenus courts pour nos apps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Pilotage réel des iPhones : à installer sur le Mac de la ferme, pas dans Docker (pas d'USB).
ios = ["pymobiledevice3>=4.10"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["loopcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
